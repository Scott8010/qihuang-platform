name: Qihuang CI CD

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qihuang_test
          POSTGRES_USER: qihuang
          POSTGRES_PASSWORD: qihuang_test_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      QH_DATABASE_URL: postgresql://qihuang:qihuang_test_pwd@localhost:5432/qihuang_test
      QH_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: 等待 PostgreSQL 就绪
        run: |
          for i in $(seq 1 15); do
            pg_isready -h localhost -U qihuang -d qihuang_test && break
            echo "等待 PostgreSQL... $i/15"
            sleep 2
          done

      - name: 等待 Redis 就绪
        run: |
          pip install redis -q
          python -c "
          import redis, time
          for i in range(10):
              try:
                  r = redis.Redis(host='localhost', port=6379)
                  if r.ping(): break
              except: pass
              time.sleep(2)
          "

      - name: 诊断路由挂载
        run: |
          python -c "
          from qihuang_platform.main import app
          routes = [r.path for r in app.routes if hasattr(r, 'path')]
          acupoint_routes = [p for p in routes if 'acupoint' in p]
          print(f'总路由数: {len(routes)}')
          print(f'acupoint路由: {acupoint_routes}')
          if not acupoint_routes:
              print('WARNING: acupoint路由未挂载！')
              # 检查capability导入
              try:
                  from qihuang_platform.capability import capability_router
                  print('capability_router导入成功')
              except Exception as e:
                  print(f'capability_router导入失败: {e}')
          "

      - name: 运行测试
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=qihuang_platform \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml \
            --junitxml=junit.xml

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
            junit.xml

      - name: 覆盖率徽章
        if: matrix.python-version == '3.13'
        run: |
          echo "## 覆盖率报告" >> $GITHUB_STEP_SUMMARY
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = root.attrib.get('line-rate', '0')
          pct = float(rate) * 100
          print(f'行覆盖率: {pct:.1f}%')
          " >> $GITHUB_STEP_SUMMARY

  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装 linter
        run: pip install ruff==0.9.10
      - name: Ruff 检查
        run: |
          echo "## Ruff 版本 $(ruff --version)" >> $GITHUB_STEP_SUMMARY
          ruff check qihuang_platform/ tests/ \
            --select=E,F,W,I \
            --ignore=E501,E712,E741,F401,F541,F601,F821,F841,I001,N999,W291,W293 \
            --ignore=E401,E402,E701,E702
      - name: AST 语法检查
        run: |
          python -c "
          import ast, sys, os
          errors = 0
          for root_name in ['qihuang_platform', 'tests']:
              for root, dirs, files in os.walk(root_name):
                  dirs[:] = [d for d in dirs if d not in ('__pycache__', '.pytest_cache', 'frontend-admin')]
                  for f in files:
                      if f.endswith('.py'):
                          path = os.path.join(root, f)
                          try:
                              with open(path) as fp:
                                  ast.parse(fp.read())
                          except SyntaxError as e:
                              print(f'SYNTAX ERROR: {path}: {e}')
                              errors += 1
          if errors:
              print(f'共 {errors} 个语法错误')
              sys.exit(1)
          print('所有 Python 文件语法检查通过')
          "

  deploy:
    name: deploy to prod
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, 'kg-stats-dump')
    environment: production

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建前端运营控制台
        working-directory: frontend-admin-react
        env:
          CI: "false"
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: SSH 部署（后端 8602 包）
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --exclude='.git/' --exclude='.github/' --exclude='tests/' --exclude='__pycache__/' --exclude='*.pyc' --exclude='.pytest_cache/' --exclude='test_*.db' --exclude='*.md' --exclude='docs/'"
          SOURCE: "qihuang_platform/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: "/root/qihuang_platform/qihuang_platform/"

      - name: SSH 部署（前端 dist）
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --exclude='.git/'"
          SOURCE: "frontend-admin-react/dist/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: "/root/qihuang_platform/frontend-admin-react/dist/"

      - name: SSH 部署（命理/风水 H5 静态页）
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --exclude='.git/'"
          SOURCE: "fortune-h5/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: "/root/qihuang_platform/fortune-h5/"

      - name: SSH 部署（H5 C 端代理脚本）
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --exclude='.git/'"
          SOURCE: "scripts/fortune_proxy.py"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: "/root/qihuang_platform/scripts/"

      - name: nginx reverse proxy fallback fix (only if commit msg has nginx-fix-cdn)
        if: contains(github.event.head_commit.message, 'nginx-fix-cdn')
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no scripts/fix-cdn-nginx.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/fix-cdn-nginx.sh
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash /tmp/fix-cdn-nginx.sh /etc/nginx/conf.d/cdn.yshealth.com.cn.conf'
          rm -f /tmp/fix-cdn-nginx.sh

      - name: dump cdn conf for diagnosis
        if: always()
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'DUMPCDN'
            echo "==== /etc/nginx/conf.d/cdn.yshealth.com.cn.conf (after fix) ===="
            cat -n /etc/nginx/conf.d/cdn.yshealth.com.cn.conf 2>/dev/null
            echo ""
            echo "==== nginx -t ===="
            nginx -t 2>&1 | head -5
            echo ""
            echo "==== /etc/nginx/conf.d/qihuang.conf (catch-all server block markers) ===="
            grep -n 'server_name\|listen\|location\|proxy_pass\|return 404' /etc/nginx/conf.d/qihuang.conf 2>/dev/null | head -50
            echo ""
            echo "==== self check from prod: BOSS URL (IP, no resolve -> catch-all) ===="
            curl -sk -i --max-time 5 https://111.231.63.73/platform/health 2>&1 | head -6
            echo ""
            curl -sk -i --max-time 5 https://111.231.63.73/billing/v1/wallet/demo 2>&1 | head -6
            echo ""
            echo "==== self check from prod: cdn SNI ===="
            curl -sk --resolve cdn.yshealth.com.cn:443:127.0.0.1 -o /dev/null -w "cdn /platform/health        -> %{http_code}\n" --max-time 5 https://cdn.yshealth.com.cn/platform/health
            curl -sk --resolve cdn.yshealth.com.cn:443:127.0.0.1 -o /dev/null -w "cdn /billing/v1/wallet/demo -> %{http_code}\n" --max-time 5 https://cdn.yshealth.com.cn/billing/v1/wallet/demo
          DUMPCDN

      - name: 重启服务（systemd 单一真源，避免与 nohup/pkill 冲突）
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'DEPLOY_SCRIPT'
            set -e
            cd /root/qihuang_platform
            echo "[1/2] 重启 8602（systemd qihuang-admin.service）..."
            systemctl restart qihuang-admin
            echo "[1.5/2] 重启命理/风水 H5 代理（若存在）..."
            systemctl restart fortune-h5 2>/dev/null || true
            echo "[2/2] 等待健康检查..."
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://localhost:8602/platform/health; then
                echo "  8602 健康，部署完成"
                exit 0
              fi
              echo "  等待健康... $i/30"
              sleep 2
            done
            echo "健康检查超时，请检查 journalctl -u qihuang-admin"
            exit 1
          DEPLOY_SCRIPT

      - name: 验证前端 bundle 完整性（防 ssh-deploy 漏同步导致白屏）
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'VERIFY'
            set -e
            cd /root/qihuang_platform/frontend-admin-react/dist
            REF=$(grep -oE "assets/index-[A-Za-z0-9_-]+\.js" index.html | head -1)
            if [ -z "$REF" ]; then echo "FATAL: index.html 未引用任何 JS bundle"; exit 1; fi
            if [ ! -f "$REF" ]; then echo "FATAL: 前端 bundle 漏同步 ($REF 不存在，index.html 已指向它 -> 线上会白屏)"; exit 1; fi
            echo "OK: 前端 bundle $REF 完整 ($(wc -c < "$REF") bytes)"
          VERIFY

  kg-dump:
    name: dump 8601 kg stats (prod, latest)
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'kg-stats-dump')
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: ssh dump 8601 status from prod
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'KGSTATS'
            PID=$( (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -w 8601 | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
            echo "8601 pid=$PID"
            echo "=== try each KEY-like env var ==="
            tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep -iE "^(QIHUANG_API_KEY|X_API_KEY|API_KEY|KB_API_KEY|KNOWLEDGE_API_KEY)=" | while IFS= read -r line; do
              name=${line%%=*}; val=${line#*=}
              resp=$(curl -s --max-time 6 -H "X-API-Key: $val" http://127.0.0.1:8601/api/v1/status)
              echo "$name => $(echo "$resp" | head -c 90)"
            done
            echo "=== try default key ==="
            curl -s --max-time 6 -H "X-API-Key: qihuang-platform-internal-key-dev" http://127.0.0.1:8601/api/v1/status | head -c 90
          KGSTATS
