name: Diagnose Nginx (生产机)

on:
  workflow_dispatch:  # manual trigger

jobs:
  diag:
    name: diag
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: write nginx snippet locally
        run: |
          mkdir -p /tmp/fix
          cat > /tmp/fix/snippet.conf <<'NGINX_SNIPPET'
          # added by diagnose-nginx 2026-08-26
          server {
              listen 443 ssl default_server;
              server_name _;
              ssl_certificate /etc/letsencrypt/live/yshealth.com.cn/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/yshealth.com.cn/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
              location / {
                  proxy_pass http://127.0.0.1:8602;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 120s;
                  proxy_connect_timeout 10s;
              }
          }
          server {
              listen 80 default_server;
              server_name _;
              return 301 https://$host$request_uri;
          }
          NGINX_SNIPPET
          echo "snippet size: $(wc -c < /tmp/fix/snippet.conf)"

      - name: ssh + diagnose + fix + reload + self check
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no /tmp/fix/snippet.conf ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/qihuang_snippet.conf
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'DIAG'
            set -e
            CONF=/etc/nginx/conf.d/qihuang.conf
            echo "==== [1] existing conf.d ===="
            ls -la /etc/nginx/conf.d/
            echo ""
            echo "==== [2] loaded server_name ===="
            nginx -T 2>/dev/null | grep -E "server_name" | head -20
            echo ""
            echo "==== [3] 443 local self check (BEFORE) ===="
            curl -sk -o /dev/null -w "GET https://127.0.0.1/platform/health -> %{http_code}\n" --max-time 5 https://127.0.0.1/platform/health
            curl -sk -o /dev/null -w "GET https://127.0.0.1/billing/v1/wallet/demo -> %{http_code}\n" --max-time 5 https://127.0.0.1/billing/v1/wallet/demo
            echo ""
            echo "==== [4] backup + append + test + reload ===="
            BACKUP=${CONF}.bak.$(date +%Y%m%d_%H%M%S)
            cp -p "$CONF" "$BACKUP"
            cat /tmp/qihuang_snippet.conf >> "$CONF"
            nginx -t
            nginx -s reload
            sleep 1
            echo ""
            echo "==== [5] 443 local self check (AFTER) ===="
            curl -sk -o /dev/null -w "GET https://127.0.0.1/platform/health -> %{http_code}\n" --max-time 5 https://127.0.0.1/platform/health
            curl -sk -o /dev/null -w "GET https://127.0.0.1/billing/v1/wallet/demo -> %{http_code}\n" --max-time 5 https://127.0.0.1/billing/v1/wallet/demo
            rm -f /tmp/qihuang_snippet.conf
          DIAG

      - name: self check from runner
        run: |
          sleep 3
          echo "==== [6] from runner to public IP 443 ===="
          curl -sk -o /dev/null -w "GET https://111.231.63.73/platform/health -> %{http_code}\n" --max-time 8 https://111.231.63.73/platform/health
          curl -sk -o /dev/null -w "GET https://111.231.63.73/billing/v1/wallet/demo -> %{http_code}\n" --max-time 8 https://111.231.63.73/billing/v1/wallet/demo
          echo ""
          echo "==== [7] body of wallet (should be 401 JSON, not nginx 404) ===="
          curl -sk --max-time 8 https://111.231.63.73/billing/v1/wallet/demo 2>&1 | head -10
