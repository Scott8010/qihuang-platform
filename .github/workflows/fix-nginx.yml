name: fix-nginx-ip-reverse-proxy

on:
  workflow_dispatch:

jobs:
  fix:
    name: fix-nginx
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: write nginx snippet to local file
        run: |
          mkdir -p /tmp/fix
          cat > /tmp/fix/snippet.conf <<'NGINX_SNIPPET'
          # added by fix-nginx-ip-reverse-proxy 2026-08-26
          server {
              listen 443 ssl default_server;
              server_name _;
              ssl_certificate /etc/letsencrypt/live/yshealth.com.cn/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/yshealth.com.cn/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
              location / {
                  proxy_pass http://127.0.0.1:8602;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 120s;
                  proxy_connect_timeout 10s;
              }
          }
          server {
              listen 80 default_server;
              server_name _;
              return 301 https://$host$request_uri;
          }
          NGINX_SNIPPET
          echo "snippet written, size: $(wc -c < /tmp/fix/snippet.conf)"

      - name: scp snippet to production
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no /tmp/fix/snippet.conf ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/qihuang_snippet.conf

      - name: ssh apply: backup, append, test, reload
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'APPLY'
            set -e
            CONF=/etc/nginx/conf.d/qihuang.conf
            BACKUP=${CONF}.bak.$(date +%Y%m%d_%H%M%S)
            echo "[1] backup -> $BACKUP"
            cp -p "$CONF" "$BACKUP"
            echo "[2] append snippet to $CONF"
            cat /tmp/qihuang_snippet.conf >> "$CONF"
            echo "[3] nginx -t"
            nginx -t
            echo "[4] nginx -s reload"
            nginx -s reload
            sleep 1
            echo "[5] self check (from prod to local 443)"
            curl -sk -o /dev/null -w "GET https://127.0.0.1/platform/health -> %{http_code}\n" --max-time 5 https://127.0.0.1/platform/health
            curl -sk -o /dev/null -w "GET https://127.0.0.1/billing/v1/wallet/demo -> %{http_code}\n" --max-time 5 https://127.0.0.1/billing/v1/wallet/demo
            rm -f /tmp/qihuang_snippet.conf
          APPLY

      - name: self check (from runner to public IP)
        run: |
          sleep 3
          echo "[6] from runner -> public IP 443"
          curl -sk -o /dev/null -w "GET https://111.231.63.73/platform/health -> %{http_code}\n" --max-time 8 https://111.231.63.73/platform/health
          curl -sk -o /dev/null -w "GET https://111.231.63.73/billing/v1/wallet/demo -> %{http_code}\n" --max-time 8 https://111.231.63.73/billing/v1/wallet/demo
          echo "[7] body of wallet endpoint (should be 401 JSON, not nginx 404 html)"
          curl -sk --max-time 8 https://111.231.63.73/billing/v1/wallet/demo 2>&1 | head -10
