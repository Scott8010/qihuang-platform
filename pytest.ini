[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --maxfail=10
markers =
    slow: 慢速测试（需要 LLM 调用的）
    integration: 集成测试
    unit: 单元测试
    gateway: API网关端点
    rbac: RBAC权限端点
    capability: 中台能力端点
    control: 控制端端点
    mock: Mock端点
