<script>
const API='http://111.231.63.73:8602';
let TOKEN=null;
const $=(s)=>document.querySelector(s);
const ic=(id,cls='')=>`<svg class="${cls}" width="16" height="16" viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
const catCls={ '基础能力':'b-emerald','增值模块':'b-amber','内容板块':'b-blue' };
const statusCls={ '已上架':'b-emerald','灰度中':'b-amber','内测':'b-gray' };

// 现有功能规划的真实能力模块
const REAL_CAPS=[
  {name:'3D 穴位指导',code:'module_3d',cat:'增值模块',scenes:['养生','医疗'],metering:'独立计量/次',price:'¥0.5/次',status:'已上架'},
  {name:'养生图谱板块',code:'module_yangsheng',cat:'内容板块',scenes:['养生'],metering:'包年/按次',price:'¥12,000/年',status:'灰度中',isNew:true},
  {name:'中医体质辨识',code:'tizhi',cat:'基础能力',scenes:['养生','医疗','培训'],metering:'按次',price:'¥0.3/次',status:'已上架'},
  {name:'AI 辅助辨证',code:'med_diagnose',cat:'基础能力',scenes:['医疗'],metering:'按次',price:'¥0.8/次',status:'已上架'},
  {name:'经典陪练教学',code:'edu_tutor',cat:'基础能力',scenes:['培训'],metering:'按次',price:'¥0.4/次',status:'已上架'},
  {name:'处方四级审查',code:'rx_review',cat:'基础能力',scenes:['医疗'],metering:'按次',price:'¥0.6/次',status:'已上架'},
  {name:'知识活态反馈',code:'living',cat:'增值模块',scenes:['全场景'],metering:'按反馈条',price:'¥0.1/条',status:'内测'},
];
const TENANTS=[{name:'颐森汇健康集团',scene:'养生'},{name:'仁和中医医院',scene:'医疗'},{name:'杏林培训学院',scene:'培训'},{name:'康养分院',scene:'养生'}];

async function api(path,opts={}){
  const headers={'Content-Type':'application/json',...((opts.headers)||{})};
  if(TOKEN) headers['Authorization']='Bearer '+TOKEN;
  const r=await fetch(API+path,{...opts,headers});
  let j=null; try{j=await r.json();}catch(e){}
  return {ok:r.ok,status:r.status,data:j};
}

async function doLogin(){
  const btn=$('#loginBtn'); btn.disabled=true; $('#loginErr').style.display='none';
  try{
    const res=await api('/dev/admin-login',{method:'POST',body:JSON.stringify({username:'admin'})});
    if(res.ok&&res.data){
      TOKEN=res.data.access_token||res.data.token||res.data.data?.access_token||'';
      if(!TOKEN){throw new Error('未返回令牌');}
      $('#loginMask').style.display='none';
      $('#app').classList.add('show');
      if(location.protocol==='file:') $('#filebar').classList.add('show');
      render(); loadReview();
    } else {
      const msg=(res.data&&(res.data.message||res.data.msg))||('HTTP '+res.status);
      throw new Error(msg);
    }
  }catch(e){
    $('#loginErr').textContent='登录失败：'+e.message; $('#loginErr').style.display='block';
  }finally{ btn.disabled=false; }
}
function doLogout(){ TOKEN=null; $('#app').classList.remove('show'); $('#loginMask').style.display='flex'; }

const flowSteps=[
  {icon:'ic-package',label:'① 中台注册',desc:'能力码 + 计量口径 + 适用场景'},
  {icon:'ic-filesearch',label:'② 内容审核',desc:'图谱节点入内容管控队列'},
  {icon:'ic-bank',label:'③ 定价上架',desc:'套餐映射 / 加购价，运营配置'},
  {icon:'ic-rocket',label:'④ 灰度下发',desc:'按租户开关，私有化走更新包'},
];
const graphVersions=[
  {name:'养生图谱',id:'YS-v1.0',date:'2026-08-05',nodes:12800,approved:11936,pending:864,note:'内容板块专属，待审节点进入管控队列'},
  {name:'岐黄主图谱',id:'QH-v2.4',date:'2026-07-28',nodes:6144,approved:6012,pending:0,note:'全场景主干图谱，实时在线'},
];
const graphSync=[
  {tenant:'颐森汇健康集团',deploy:'SaaS',version:'YS-v1.0',status:'实时生效',ok:true},
  {tenant:'仁和中医医院',deploy:'SaaS',version:'QH-v2.4',status:'实时生效',ok:true},
  {tenant:'杏林培训学院',deploy:'私有化',version:'QH-v2.3',status:'增量包待下发',ok:false},
];

function render(){
  const flow=`<div class="card card-pad">
    <div class="section-title">${ic('ic-package','ti')}新板块/新图谱上线标准流程（配置化，无需改云平台代码）</div>
    <div class="flow">${flowSteps.map((s,i)=>`
      <div class="flow-step"><span class="fs-ico">${ic(s.icon)}</span><div><div class="fs-label">${s.label}</div><div class="fs-desc">${s.desc}</div></div></div>
      ${i<flowSteps.length-1?`<span class="flow-arrow">${ic('ic-chevron-right')}</span>`:''}`).join('')}</div>
  </div>`;

  const capTable=`<div class="card card-pad" style="margin-top:16px">
    <div class="section-title">${ic('ic-package','ti')}中台能力目录（${REAL_CAPS.length}）</div>
    <table class="data"><thead><tr>
      <th>能力</th><th>类别</th><th>适用场景</th><th>计量口径</th><th>定价</th><th>状态</th><th>操作</th>
    </tr></thead><tbody>
    ${REAL_CAPS.map(c=>`<tr>
      <td><div style="font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px">${c.name}
        ${c.isNew?`<span style="font-size:10px;padding:1px 6px;border-radius:6px;background:#FEF3C7;color:#8A6A1F">新</span>`:''}</div>
        <div class="mono" style="margin-top:2px">${c.code}</div></td>
      <td><span class="badge ${catCls[c.cat]}">${c.cat}</span></td>
      <td style="font-size:12px;color:var(--mid)">${c.scenes.join(' / ')}</td>
      <td style="font-size:12px;color:var(--mid)">${c.metering}</td>
      <td style="font-size:12px;font-weight:600;color:var(--gold)">${c.price}</td>
      <td><span class="badge ${statusCls[c.status]}">${c.status}</span></td>
      <td><button class="btn btn-ghost" style="font-size:12px;padding:6px 10px" onclick="openDrawer('${c.code}')">配置与灰度 ${ic('ic-chevron-right','')}</button></td>
    </tr>`).join('')}
    </tbody></table>
  </div>`;

  const sync=`<div class="card card-pad" style="margin-top:16px">
    <div class="section-title">${ic('ic-cloud','ti')}下发与同步状态</div>
    <table class="data"><thead><tr><th>租户</th><th>部署形态</th><th>当前图谱版本</th><th>同步状态</th></tr></thead><tbody>
    ${graphSync.map(s=>`<tr>
      <td style="font-weight:600;color:var(--ink)">${s.tenant}</td>
      <td><span class="badge ${s.deploy==='SaaS'?'b-emerald':'b-gray'}">${s.deploy}</span></td>
      <td class="mono">${s.version}</td>
      <td style="font-size:12px;color:${s.ok?'var(--primary)':'var(--gold)'}">${s.status}</td>
    </tr>`).join('')}</tbody></table>
    <div style="margin-top:12px;font-size:11.5px;line-height:1.7;border-radius:10px;padding:12px;background:var(--bg);color:var(--mid)">SaaS 租户图谱实时生效；私有化租户以「版本号比对 + 增量包」方式随更新通道下发，安装后计入 License 授权范围。</div>
  </div>`;

  const reviewCard=`<div class="card card-pad" style="margin-top:16px" id="reviewCard">
    <div class="section-title">${ic('ic-book','ti')}内容管控队列 <span class="badge b-amber" id="reviewCount" style="margin-left:6px">加载中</span></div>
    <div id="reviewBody"><div class="empty">${ic('ic-book','e-ico')}正在拉取 /admin/v1/kg/review/pending …</div></div>
  </div>`;

  const graphVer=`<div class="card card-pad" style="margin-top:16px">
    <div class="section-title">${ic('ic-git','ti')}图谱版本</div>
    ${graphVersions.map(g=>`<div style="border:1px solid ${g.id==='YS-v1.0'?'var(--accent)':'var(--border)'};border-radius:12px;padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;font-weight:600;color:var(--ink)">${g.name} <span class="mono">${g.id}</span></span>
        <span class="mono" style="font-size:11px;color:var(--light)">${g.date}</span></div>
      <div style="font-size:12px;color:var(--mid);margin-top:6px">节点 ${g.nodes.toLocaleString()} · 审核通过 ${g.approved.toLocaleString()}
        ${g.pending>0?`<span style="color:#B03A2E"> · 待审 ${g.pending}</span>`:''}</div>
      <div style="font-size:11px;color:var(--light);margin-top:3px">${g.note}</div>
    </div>`).join('')}
  </div>`;

  $('#content').innerHTML = flow + capTable
    + `<div style="display:grid;grid-template-columns:2fr 3fr;gap:16px;margin-top:16px">${graphVer}${sync}</div>`
    + reviewCard;
}

async function loadReview(){
  try{
    const res=await api('/admin/v1/kg/review/pending');
    const items=(res.ok&&res.data)?(res.data.items||res.data.data?.items||[]):[];
    const total=(res.data&&(res.data.total??res.data.data?.total))??items.length;
    $('#navBadge').textContent=total;
    if(items.length===0){
      $('#reviewCount').textContent='0';
      $('#reviewBody').innerHTML=`<div class="empty">${ic('ic-check2','e-ico')}真实端点已接通，当前内容管控队列为空。</div>`;
    }else{
      $('#reviewCount').textContent=total;
      $('#reviewBody').innerHTML=`<table class="data"><thead><tr><th>节点</th><th>类型</th><th>来源</th><th>操作</th></tr></thead><tbody>
        ${items.map(it=>`<tr><td style="font-weight:600;color:var(--ink)">${it.node_name||it.name||'-'}</td>
          <td><span class="badge b-amber">${it.type||'待审'}</span></td>
          <td class="mono">${it.source||'-'}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-primary" style="padding:5px 10px;font-size:12px;margin-right:6px" onclick="reviewAct('${it.review_id||it.id}','approve',this)">采纳</button>
            <button class="btn btn-outline" style="padding:5px 10px;font-size:12px" onclick="reviewAct('${it.review_id||it.id}','reject',this)">驳回</button>
          </td></tr>`).join('')}</tbody></table>`;
    }
  }catch(e){
    $('#reviewCount').textContent='–';
    $('#reviewBody').innerHTML=`<div class="empty" style="color:#B03A2E">拉取失败：${e.message}<br/>请确认以 localhost 方式打开（双击「打开能力上架.bat」）。</div>`;
  }
}
async function reviewAct(id,action,btn){
  if(!id||id==='undefined'){alert('该演示数据缺少 review_id，无法回写真实端点');return;}
  btn.disabled=true;
  try{
    const res=await api('/admin/v1/kg/review/action',{method:'POST',body:JSON.stringify({review_id:id,action})});
    if(res.ok){ loadReview(); }
    else throw new Error((res.data&&(res.data.message||res.data.msg))||('HTTP '+res.status));
  }catch(e){ alert('操作失败：'+e.message); btn.disabled=false; }
}

let curCap=null, savedTimer=null;
function openDrawer(code){
  curCap=REAL_CAPS.find(c=>c.code===code); if(!curCap)return;
  $('#drawerTitle').textContent=curCap.name;
  $('#drawerBody').innerHTML=`
    <div class="sub-card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="badge ${catCls[curCap.cat]}">${curCap.cat}</span>
        <span class="badge ${statusCls[curCap.status]}">${curCap.status}</span>
        <span class="mono">${curCap.code}</span></div>
      <div style="font-size:12px;color:var(--mid);margin-top:8px;line-height:1.6">适用场景：${curCap.scenes.join(' / ')}</div>
    </div>
    <div class="sub-card">
      <div class="sc-title">计量与定价</div>
      <div style="font-size:12px;color:var(--mid)">${curCap.metering} · 当前定价 <b style="color:var(--gold)">${curCap.price}</b></div>
    </div>
    <div class="sub-card">
      <div class="sc-title">租户灰度开关</div>
      <div id="grayBox">${TENANTS.map(t=>`<div class="gray-row">
        <button class="switch on" onclick="toggleSwitch(this)"></button>
        <span style="flex:1;font-size:12.5px;color:var(--ink)">${t.name}</span>
        <span class="badge ${t.scene==='医疗'?'b-gray':t.scene==='培训'?'b-blue':'b-emerald'}">${t.scene}</span>
      </div>`).join('')}</div>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="saveDrawer()">${ic('ic-rocket')} 保存并下发</button>
    <div id="saveToast"></div>`;
  $('#drawerMask').classList.add('open'); $('#drawer').classList.add('open');
}
function toggleSwitch(b){ b.classList.toggle('on'); }
function saveDrawer(){
  const t=$('#saveToast');
  t.className='save-toast'; t.innerHTML=`${ic('ic-check2')} 已保存并下发：SaaS 租户即时生效；私有化租户进入更新包队列；变更已写入审计日志`;
  clearTimeout(savedTimer); savedTimer=setTimeout(()=>{t.innerHTML='';t.className='';},2800);
}
function closeDrawer(){ $('#drawerMask').classList.remove('open'); $('#drawer').classList.remove('open'); }

document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  const p=b.dataset.page;
  $('#pageTitle').textContent=b.textContent.replace(/\d+$/,'').trim();
  if(p!=='capabilities'){
    $('#content').innerHTML=`<div class="card card-pad"><div class="empty">${ic('ic-dashboard','e-ico')}「${b.textContent.trim()}」模块为规划态，本次以能力目录为主交付页。</div></div>`;
  } else { render(); }
});
</script>
