<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>运营控制台 · 岐黄智脑</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="qihuang-design.css?v=2" />
<style>
/* ===== console 专属组件（建立在 qihuang-design 设计系统之上） ===== */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:16px;margin-bottom:16px}
.metric{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(34,49,43,.04);transition:box-shadow .2s,transform .2s}
.metric:hover{box-shadow:0 8px 24px rgba(34,49,43,.08);transform:translateY(-2px)}
.m-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.m-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.m-ico svg{width:20px;height:20px;min-width:0;min-height:0}
.m-label{font-size:12px;color:var(--light)}
.m-val{font-size:26px;font-weight:700;color:var(--ink);line-height:1}
.m-delta{font-size:11.5px;margin-top:8px;display:flex;align-items:center;gap:4px}
.m-delta svg{width:14px;height:14px}
.m-delta.up{color:#047857}.m-delta.down{color:#B03A2E}.m-delta.flat{color:var(--light)}
.spark{margin-top:8px}
.grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.toolbar .spacer{margin-left:auto}
.btn-primary svg,.btn-outline svg,.btn-ghost svg{width:1em;height:1em;min-width:0;min-height:0}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--light)}
.kv .v{color:var(--ink);font-weight:600}
.bar{height:7px;border-radius:999px;background:var(--bg);overflow:hidden;flex:1}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.bar.warn>i{background:var(--accent)}.bar.crit>i{background:#B03A2E}
.usage{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--mid);min-width:140px}
.alert-row{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:11px;padding:12px 14px;margin-bottom:10px;background:#fff}
.alert-row.crit{border-left-color:#B03A2E}
.alert-row .a-title{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
.alert-row .a-msg{font-size:12px;color:var(--mid);margin-top:5px;line-height:1.6}
.alert-row .a-sug{font-size:11.5px;color:var(--gold);margin-top:5px}
.svc-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.svc-row:last-child{border-bottom:none}
.svc-name{font-size:13px;font-weight:600;color:var(--ink);flex:1}
.svc-meta{font-size:11.5px;color:var(--light);font-family:ui-monospace,monospace}
.llm-prov{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.llm-prov:last-child{border-bottom:none}
.llm-prov .lp-name{flex:1;color:var(--ink);font-weight:600}
.llm-prov .lp-role{font-size:11px;color:var(--light)}
.op-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:9px}
.op-row .o-time{font-family:ui-monospace,monospace;font-size:11px;color:var(--light);width:46px}
.op-row .o-user{font-size:12.5px;color:var(--ink);font-weight:600;width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-row .o-act{font-size:12px;color:var(--mid);flex:1}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.plan-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;transition:box-shadow .2s,transform .2s}
.plan-card:hover{box-shadow:0 8px 24px rgba(34,49,43,.08);transform:translateY(-2px)}
.plan-card .p-name{font-size:14px;font-weight:700;color:var(--primary)}
.plan-card .p-scene{font-size:11px;color:var(--light);margin-top:2px}
.plan-card .p-price{font-size:22px;font-weight:800;color:var(--gold);margin:12px 0 4px}
.plan-card .p-price small{font-size:11px;font-weight:500;color:var(--light)}
.plan-card .p-line{font-size:11.5px;color:var(--mid);display:flex;justify-content:space-between;padding:3px 0}
.empty .e-illu{width:64px;height:64px;color:var(--border);margin:0 auto 12px}
.empty .e-tip{font-size:12px;color:var(--light);margin-top:4px;max-width:340px;margin-left:auto;margin-right:auto;line-height:1.6}
.drawer-actions{display:flex;gap:10px;margin-top:4px}
.drawer-actions .btn{flex:1}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-size:12.5px;color:var(--mid);cursor:pointer;transition:all .15s}
.seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 2px rgba(34,49,43,.08)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--mid);margin-bottom:6px;font-weight:500}
.field input,.field select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;outline:none;transition:border-color .15s;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus{border-color:var(--primary)}
.perm-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);padding:5px 8px;border-radius:8px;cursor:pointer;transition:background .12s}
.perm-item:hover{background:var(--bg)}
.perm-item input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
.perm-item .p-code{color:var(--light);font-size:11px;font-family:ui-monospace,monospace;margin-left:auto}
.notice.info{background:var(--soft);border-color:var(--border);color:var(--primary)}
.notice.info .notice-ico{background:var(--primary)}
.notice.warn{background:#FFFBEB;border-color:#FDE68A;color:var(--gold)}
.notice.warn .notice-ico{background:var(--accent)}
.chart-card .c-legend{display:flex;gap:16px;margin-top:8px;font-size:11.5px;color:var(--mid)}
.chart-card .c-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.content > .view{animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.dot-ok{color:#10b981}.dot-warn{color:var(--accent)}.dot-crit{color:#B03A2E}
.action-cell{display:inline-flex;align-items:center;gap:6px;position:relative}
.action-cell .btn-outline{padding:5px 9px;font-size:12px}
.action-more{position:relative}
.action-more .btn-outline{padding:5px 8px;font-size:12px;display:inline-flex;align-items:center;gap:3px}
.action-more .btn-outline::after{content:'▼';font-size:9px;color:var(--light)}
.actions-menu{position:absolute;right:0;top:calc(100% + 5px);min-width:118px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(34,49,43,.12);padding:6px;z-index:100;display:none}
.actions-menu.open{display:block}
.actions-menu button{display:flex;align-items:center;gap:7px;width:100%;padding:7px 9px;border:none;background:transparent;border-radius:7px;font-size:12px;color:var(--ink);cursor:pointer;text-align:left;transition:background .12s}
.actions-menu button:hover{background:var(--bg)}
.actions-menu button.danger{color:var(--coral)}
</style>
</head>

<script>
const API='http://127.0.0.1:8659';
let TOKEN=null, currentView='dashboard';
const $=s=>document.querySelector(s);
const ic=(id,cls='')=>`<svg class="${cls}" width="16" height="16" viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=c=>`¥${(Math.round((c||0)/100)).toLocaleString()}`;
const statusCls={'active':'b-emerald','running':'b-emerald','normal':'b-emerald','suspended':'b-amber','disabled':'b-gray','inactive':'b-gray','readonly':'b-gray','warning':'b-amber','warn':'b-amber','closed':'b-gray','paused':'b-gray','pending':'b-amber','issued':'b-blue','paid':'b-emerald','overdue':'b-gray','rejected':'b-gray','approved':'b-emerald','block':'b-gray','OK':'b-emerald','TBD':'b-gray','RUNNING':'b-emerald','PLANNED':'b-blue','内测':'b-gray','已上架':'b-emerald','灰度中':'b-amber','规划中':'b-gray'};
const sBadge=s=>`<span class="badge ${statusCls[s]||'b-gray'}">${esc(s||'未知')}</span>`;

async function api(path,opts={}){
  const headers={'Content-Type':'application/json',...((opts.headers)||{})};
  if(TOKEN) headers['Authorization']='Bearer '+TOKEN;
  try{
    const r=await fetch(API+path,{...opts,headers});
    let j=null; try{j=await r.json();}catch(e){}
    return {ok:r.ok,status:r.status,data:j};
  }catch(e){ return {ok:false,status:0,data:null,error:e.message}; }
}
// 统一解析：success({...}) / paginated({items,total}) / data.items
function rowsOf(d){ if(!d)return []; const x=d.data||d; if(Array.isArray(x))return x; if(x&&Array.isArray(x.items))return x.items; if(x&&Array.isArray(x.services))return x.services; if(x&&Array.isArray(x.providers))return x.providers; if(x&&Array.isArray(x.metrics))return x.metrics; return []; }
function numOf(d,keys){ const x=d&&(d.data||d); for(const k of keys){ if(x&&x[k]!=null)return x[k]; } return null; }

async function doLogin(){
  const btn=$('#loginBtn'); btn.disabled=true; $('#loginErr').style.display='none';
  try{
    const res=await api('/dev/admin-login',{method:'POST',body:JSON.stringify({username:'admin'})});
    if(res.ok&&res.data){
      TOKEN=res.data.access_token||res.data.token||(res.data.data&&res.data.data.access_token)||'';
      if(!TOKEN) throw new Error('未返回令牌');
      $('#loginMask').style.display='none';
      $('#app').classList.add('show');
      go('dashboard');
      loadBadge();
    } else throw new Error((res.data&&(res.data.message||res.data.msg))||('HTTP '+(res.status||'网络错误')));
  }catch(e){ $('#loginErr').textContent='登录失败：'+(e.message||e); $('#loginErr').style.display='block'; }
  finally{ btn.disabled=false; }
}

/* ============ 通用组件 ============ */
function emptyState(icon,title,tip){ return `<div class="empty"><svg class="e-illu" viewBox="0 0 24 24"><use href="#${icon}"/></svg><div>${title}</div>${tip?`<div class="e-tip">${tip}</div>`:''}</div>`; }
function errState(msg){ return `<div class="empty" style="color:#B03A2E"><svg class="e-illu" viewBox="0 0 24 24"><use href="#ic-alert"/></svg>加载失败：${esc(msg)}<div class="e-tip">请确认以 localhost 方式打开（双击「打开运营台.bat」），且公网 8602 可达。</div></div>`; }
function sparkline(vals,w=260,h=56){
  if(!vals||!vals.length) return '';
  const max=Math.max(...vals,1), min=Math.min(...vals,0), n=vals.length;
  const X=i=>n===1?0:(i/(n-1)*w);
  const Y=v=>h-4-((v-min)/((max-min)||1))*(h-10);
  const line=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=line+` L ${w} ${h} L 0 ${h} Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none"><path d="${area}" fill="var(--primary)" opacity=".10"/><path d="${line}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function lineChart(trend,keys,colors,w=560,h=200){
  if(!trend||!trend.length) return '';
  const n=trend.length, max=Math.max(100,...keys.flatMap(k=>trend.map(t=>t[k])));
  const X=i=>n===1?0:(i/(n-1)*w);
  const Y=v=>h-18-((v)/(max||1))*(h-40);
  let paths='';
  keys.forEach((k,ki)=>{
    const pts=trend.map((t,i)=>[X(i),Y(t[k]||0)]);
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    paths+=`<path d="${line}" fill="none" stroke="${colors[ki]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    paths+=`<circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3" fill="${colors[ki]}"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${paths}
    <line x1="0" y1="${h-18}" x2="${w}" y2="${h-18}" stroke="var(--border)"/></svg>`;
}
function openDrawer(title,html){ $('#drawerTitle').textContent=title; $('#drawerBody').innerHTML=html; $('#drawerMask').classList.add('open'); $('#drawer').classList.add('open'); }
function closeDrawer(){ $('#drawerMask').classList.remove('open'); $('#drawer').classList.remove('open'); }
let toastTimer=null;
function toast(msg,ok=true){ const t=document.createElement('div'); t.className='save-toast'; t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9999;box-shadow:0 8px 24px rgba(34,49,43,.16)'; t.innerHTML=`${ic(ok?'ic-check2':'ic-alert')} ${esc(msg)}`; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),2600); }

async function renderDashboard(){
  $('#content').innerHTML=`<div class="view"><div class="card card-pad" id="dashLoad"><div class="empty">${ic('ic-dashboard','e-ico')}正在拉取工作台数据 …</div></div></div>`;
  const [res,tenRes,audRes]=await Promise.all([
    api('/admin/v1/dashboard'),
    api('/admin/v1/tenants-extended?page=1&page_size=50'),
    api('/admin/v1/audit-logs?page=1&page_size=6')
  ]);
  if(!res.ok&&!res.data){ $('#dashLoad').outerHTML=errState(res.error||('HTTP '+res.status)); return; }
  const d=(res.data&&res.data.data)||{};
  const tenants=d.tenants||{}, api_=d.api||{}, rev=(d.revenue&&d.revenue.total_cents)||0, kg=(d.kg&&d.kg.pending)||0;
  const trend=(d.trend&&d.trend.values)||[], tdates=(d.trend&&d.trend.dates)||[];
  const diff=api_.call_diff||0;
  const metrics=`
    <div class="metrics">
      ${metricCard('ic-building','租户总数',(tenants.total||0).toLocaleString(),'flat',(tenants.active||0)+' 在订','本月新增 '+(tenants.new_this_month||0))}
      ${metricCard('ic-zap','今日调用',(api_.today_calls||0).toLocaleString(),diff>0?'up':diff<0?'down':'flat',diff>0?`▲ ${diff}`:diff<0?`▼ ${Math.abs(diff)}`:'持平','较昨日')}
      ${metricCard('ic-filesearch','待审知识',(kg||0).toLocaleString(),kg>0?'down':'flat',kg>0?`${kg} 条待审`:'队列已清空','内容管控')}
      ${metricCard('ic-dollar','累计营收',money(rev),'up','已出账/已付','元')}
    </div>`;
  // 场景调用分布（按真实租户聚合，弥补官方 mock 的「场景调用分布」）
  const tlist=rowsOf(tenRes.data);
  const sceneMap={};
  tlist.forEach(t=>{ const s=t.scene||'其他'; sceneMap[s]=(sceneMap[s]||0)+(t.usedCalls||0); });
  const sceneKeys=Object.keys(sceneMap);
  const sceneTotal=Object.values(sceneMap).reduce((a,b)=>a+b,0)||1;
  const sceneColors={'health':'var(--primary)','medical':'var(--accent)','edu':'#3B82F6','养生':'var(--primary)','医疗':'var(--accent)','培训':'#3B82F6'};
  const sceneDist=`<div class="card card-pad">
      <div class="section-title">${ic('ic-pie','ti')}场景调用分布（真实租户聚合）</div>
      ${sceneKeys.length?`<div style="display:flex;height:14px;border-radius:8px;overflow:hidden;margin:10px 0">${sceneKeys.map(s=>`<div style="flex:${(sceneMap[s]/sceneTotal*100).toFixed(1)};background:${sceneColors[s]||'var(--primary)'}"></div>`).join('')}</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">${sceneKeys.map(s=>`<div style="display:flex;align-items:center;gap:6px;font-size:12.5px"><span style="width:10px;height:10px;border-radius:3px;background:${sceneColors[s]||'var(--primary)'}"></span>${esc(s)} <b style="color:var(--ink)">${(sceneMap[s]||0).toLocaleString()}</b></div>`).join('')}</div>`:'<div class="empty">暂无租户调用数据</div>'}
    </div>`;
  const trendCard=`<div class="card card-pad">
      <div class="section-title">${ic('ic-trending','ti')}近 7 日调用趋势</div>
      ${sparkline(trend)}
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--light);margin-top:4px">${(tdates.length?tdates:[1,2,3,4,5,6,7]).map(x=>`<span>${x}</span>`).join('')}</div>
    </div>`;
  const svc=d.services||[];
  const svcCard=`<div class="card card-pad">
      <div class="section-title">${ic('ic-server','ti')}核心服务健康</div>
      ${svc.length?svc.map(s=>`<div class="svc-row"><span class="status-dot" style="background:${s.status==='normal'?'#10b981':s.status==='warning'?'var(--accent)':'#B03A2E'}"></span><span class="svc-name">${esc(s.name)}</span><span class="svc-meta">${esc(s.latency_ms!=null?s.latency_ms+'ms':'')} · ${esc(s.uptime||'')}</span></div>`).join(''):'<div class="empty">无数据</div>'}
    </div>`;
  // 通知与操作流：真实审计日志 + dashboard.recent_ops
  const audItems=rowsOf(audRes.data);
  const noticeRows=audItems.map(a=>`<div class="op-row"><span class="o-time">${esc((a.created_at||'').slice(5,16).replace('T',' '))}</span><span class="o-user">${esc(a.user_id||'系统')}</span><span class="o-act">${esc(a.action||'')} · ${esc((a.target_type||'')+':'+(a.target_id||'').slice(0,8))}</span></div>`);
  const ops=(d.recent_ops||[]).slice(0,4).map(o=>`<div class="op-row"><span class="o-time">${esc(o.time||'')}</span><span class="o-user">${esc(o.user||'系统')}</span><span class="o-act">${esc(o.action||'')} ${esc(o.target||'')}</span></div>`);
  const feed=[...noticeRows,...ops];
  const opsCard=`<div class="card card-pad">
      <div class="section-title">${ic('ic-clock','ti')}通知与操作流</div>
      ${feed.length?feed.join(''):'<div class="empty">暂无操作记录</div>'}
    </div>`;
  $('#content').innerHTML=`<div class="view">${metrics}
    <div class="grid2" style="margin-top:16px">${sceneDist}${trendCard}</div>
    <div class="grid2" style="margin-top:16px">${opsCard}${svcCard}</div>
  </div>`;
}
function metricCard(icon,label,val,deltaColor,deltaText,sub){
  const dc=deltaColor.startsWith('up')?'up':deltaColor.startsWith('down')?'down':'flat';
  const arrow=deltaColor.startsWith('up')?'▲':deltaColor.startsWith('down')?'▼':'●';
  const colors={'ic-building':'var(--primary)','ic-zap':'var(--accent)','ic-filesearch':'#3D7363','ic-dollar':'var(--gold)'};
  return `<div class="metric"><div class="m-top"><div class="m-ico" style="background:${colors[icon]||'var(--primary)'}">${ic(icon)}</div><div class="m-label">${label}</div></div>
    <div class="m-val">${val}</div>
    <div class="m-delta ${dc}">${arrow} ${deltaText}${sub?` · ${sub}`:''}</div></div>`;
}

async function openBillDetail(billId){
  openDrawer('账单明细','<div class="empty">正在拉取账单明细…</div>');
  const res=await api('/admin/v1/billing/bills/'+billId);
  const b=(res.data&&res.data.data)||{};
  const extra=b.extra||{};
  const ub=b.usage_breakdown||{};
  const byEp=(ub.by_endpoint||[]).sort((a,b)=>((b.calls||0)-(a.calls||0))).slice(0,5);
  const mod3d=(ub.by_module&&ub.by_module['3d'])||{calls:0,cost_cents:0,cdn_bytes:0};
  const planPrice=extra.plan_price||extra.plan_price_cents||0;
  const overage=extra.overage_cost_cents||Math.max(0,(b.total_cost_cents||0)-planPrice);
  const discount=extra.discount_cents||0;
  const total=b.total_cost_cents||0;
  const cdnGB=(mod3d.cdn_bytes||0)/1024/1024/1024;
  const unitPrice3d=mod3d.calls>0?(mod3d.cost_cents/mod3d.calls):0;
  const rows=[];
  rows.push({name:'套餐费',spec:esc(extra.plan_name||'订阅套餐'),qty:1,unit:'月',amt:planPrice});
  if(mod3d.calls>0) rows.push({name:'岐黄三境 3D 模块',spec:`组件加载 ${mod3d.calls.toLocaleString()} 次 × ¥${(unitPrice3d/100).toFixed(2)}/次`,qty:mod3d.calls,unit:'次',amt:mod3d.cost_cents});

  m.style.left=(rect.right)+'px';
  m.style.top=(rect.top)+'px';
  m.style.transform='translateX(-100%)';
  m.style.display='block';
  requestAnimationFrame(()=>m.classList.add('open'));
  document.addEventListener('click',onClickOutsideActions);

function permChecklistHtml(checked, prefix){

async function openRolePermEdit(roleId){

async function saveRolePerms(roleId){

async function createRole(){
  const name=($('#crName').value||'').trim().replace(/\s+/g,'_');

  const codes=[...document.querySelectorAll('#drawerBody .perm-chk:checked')].map(c=>c.value);

async function deleteRole(roleId){

  else { toast('删除失败：'+((res.data&&(res.data.message||res.data.msg))||('HTTP '+res.status)),false); }
}

    const det=a.detail||{}; const detStr=Object.keys(det).map(k=>`${k}=${det[k]}`).join('，');
    return `<tr><td style="font-size:12px;color:var(--light);white-space:nowrap">${esc((a.created_at||'').replace('T',' ').slice(0,19))}</td>
      <td style="font-weight:600;color:var(--ink)">${esc(a.user_id||'系统')}</td>
      <td><span class="badge b-blue">${esc(a.action||'-')}</span></td>
      <td class="mono" style="font-size:12px">${esc((a.target_type||'')+':'+(a.target_id||'').slice(0,12))}</td>
      <td style="font-size:12px;color:var(--mid)">${esc(detStr||'-')}</td>
      <td>${a.success?`<span class="badge b-emerald">成功</span>`:`<span class="badge b-gray">失败</span>`}</td></tr>`;
  }).join(''):emptyState('ic-filesearch','暂无审计记录','真实端点 /admin/v1/audit-logs 已接通。');
}

/* ============ 通用：pill / search ============ */
function setPill(view,pill,el){ VSTATE[view].pill=pill; el.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('active')); el.classList.add('active');
  if(view==='tenants')paintTenants(); else if(view==='keys')paintKeys(); else if(view==='billing')paintBills(); }
function onSearch(){ const v=VSTATE[currentView]; if(!v)return; v.q=$('#searchInput').value.trim();
  if(currentView==='tenants')paintTenants(); else if(currentView==='keys')paintKeys(); else if(currentView==='billing')paintBills(); }

async function loadBadge(){ const res=await api('/admin/v1/kg/review/pending'); const n=rowsOf(res.data).length; if(n){ $('#navBadge').style.display='inline-block'; $('#navBadge').textContent=n; } }
</script>
<div class="actions-menu" id="globalActionsMenu" style="display:none"></div>
