# 岐黄智脑 ruff 配置
# CI 统一入口: ruff check qihuang_platform/ tests/

target-version = "py312"
line-length = 120

[lint]
# 项目级忽略（兼容现有代码风格）
ignore = [
    "E501",   # line too long
    "UP006",  # use collections.abc instead of typing
    "UP035",  # deprecated import from typing
    "UP045",  # deprecated import from typing_extensions
    "N999",   # invalid module name
    "F401",   # unused import (太多副作用导入)
    "B904",   # raise-without-from-inside-except
    "B008",   # function-call-in-default-argument
    "SIM105", # use contextlib.suppress
]

[lint.per-file-ignores]
# 测试文件 — 放宽规则
"tests/*.py" = [
    "F841",   # unused variable
    "E712",   # comparison to False/True
    "F541",   # f-string without placeholders
    "SIM108", # use ternary operator
    "E402",   # module import not at top
    "E701",   # multiple statements on one line
    "E702",   # multiple statements on one line (colon)
    "E741",   # ambiguous variable name
    "F821",   # undefined name (conftest fixtures)
    "C401",   # unnecessary generator set
    "C416",   # unnecessary comprehension
    "UP015",  # unnecessary open mode
]

# 初始化/路由文件 — 允许未使用的导入
"qihuang_platform/**/__init__.py" = ["F401", "F841"]
"qihuang_platform/gateway/*.py" = ["E402"]
"qihuang_platform/main.py" = ["E402"]
"qihuang_platform/db/*.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
