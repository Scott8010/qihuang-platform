# 岐黄智脑平台 nginx 反代配置 (含限速加固)
# 注: limit_req_zone 必须位于 http 上下文; conf.d 文件被 include 进 http 块,
#     故文件顶层( server 块外 )的指令即生效。

limit_req_zone $binary_remote_addr zone=qh_limit:10m rate=20r/s;

server {
    server_name yshealth.com.cn www.yshealth.com.cn;

    # certbot HTTP-01 验证目录（签发 HTTPS 时用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # 限速: 单 IP 20 req/s, 突发 40 内不延迟; 超出返回 503
        limit_req zone=qh_limit burst=40 nodelay;

        proxy_pass http://127.0.0.1:8602;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yshealth.com.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yshealth.com.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.yshealth.com.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = yshealth.com.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name yshealth.com.cn www.yshealth.com.cn;
    return 404; # managed by Certbot




}
